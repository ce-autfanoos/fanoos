<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>گروه علمی فرهنگی فانوس | دانشگاه صنعتی امیرکبیر</title>
  
  <!-- فاوآیکون صفحه (لوگوی قرمز فانوس) -->
  <link rel="icon" type="image/jpeg" href="favicon.jpg" />
  <link rel="apple-touch-icon" href="favicon.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F4EFE8;
      --surface: #FFFFFF;
      --red: #B22222;
      --red-dark: #8B1A1A;
      --navy: #1D3557;
      --navy-dark: #102035;
      --gold: #C89B3C;
      --text: #22262C;
      --muted: #5C626C;
      --border: #E5DFD5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(rgba(29, 53, 87, 0.1) 1px, transparent 1px);
      background-size: 22px 22px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 18px 45px rgba(16, 32, 53, 0.1);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 100%);
      padding: 32px 24px 28px;
      text-align: center;
      position: relative;
      border-bottom: 4px solid var(--gold);
    }

    .tech-tag {
      display: inline-block;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--gold);
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 16px;
      direction: ltr;
    }

    .logo-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 14px;
      background: var(--red);
      border-radius: 50%;
      border: 3px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(178, 34, 34, 0.4);
      padding: 14px;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .header h1 {
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .header p {
      color: #DCE3EC;
      font-size: 13.5px;
      font-weight: 400;
    }

    .content {
      padding: 24px 20px 28px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 26px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #FCFBF9;
      color: var(--text);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .link-btn:hover,
    .link-btn:active {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(16, 32, 53, 0.08);
    }

    .link-btn.telegram:hover {
      border-color: #229ED9;
    }

    .link-btn.bale:hover {
      border-color: #00A693;
    }

    .link-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .telegram .icon-box {
      background: rgba(34, 158, 217, 0.12);
      color: #229ED9;
    }

    .bale .icon-box {
      background: rgba(0, 166, 147, 0.12);
      color: #00A693;
    }

    .link-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
